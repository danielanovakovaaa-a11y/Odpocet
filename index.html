<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7efe5">
<title>Už brzy doma, maminko ❤️</title>
<style>
:root{--cream:#f7efe5;--paper:#fffaf3;--rose:#b66d78;--burgundy:#713b4a;--gold:#c9a66b;--sage:#7c9188;--ink:#54343b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at top,#fffaf4 0,#f7efe5 62%,#ead8c7 100%);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
.card{position:relative;width:min(720px,100%);padding:clamp(25px,6vw,55px);text-align:center;background:rgba(255,250,243,.92);border:1px solid rgba(113,59,74,.35);outline:1px solid rgba(201,166,107,.45);outline-offset:5px;border-radius:8px;box-shadow:0 18px 50px rgba(84,52,59,.12)}
.heart{color:var(--rose);font-size:22px;letter-spacing:8px}
h1{font-size:clamp(30px,6vw,46px);line-height:1.12;color:var(--burgundy);font-weight:normal;margin:14px 0 22px}
.intro{font-size:clamp(17px,3.5vw,22px);line-height:1.5;margin:0 auto 26px;max-width:490px;color:#80535b}
.countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:28px 0}
.unit{padding:17px 4px 13px;background:#f1e6df;border:1px solid rgba(182,109,120,.22);border-radius:10px}
.number{display:block;font:700 clamp(27px,7vw,42px)/1.1 Arial,sans-serif;color:var(--burgundy);font-variant-numeric:tabular-nums}
.label{display:block;margin-top:8px;font:700 10px/1.3 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--sage)}
.divider{display:flex;align-items:center;gap:13px;justify-content:center;margin:27px auto;color:var(--gold)}
.divider:before,.divider:after{content:"";height:1px;width:70px;background:var(--gold)}
.flight{font:15px/1.9 Arial,sans-serif;color:#775a5c}
.flight strong{color:var(--burgundy)}
.hug{font-size:clamp(22px,4vw,29px);font-style:italic;color:var(--burgundy);margin:27px 0 0}
@media(max-width:390px){.countdown{gap:5px}.unit{padding:13px 2px}.label{font-size:8px;letter-spacing:.04em}}
</style>
</head>
<body>
<main class="card">
<div class="heart">♡ &nbsp; ♡ &nbsp; ♡</div>
<h1>Už brzy doma,<br>maminko ❤️</h1>
<p class="intro">Z Austrálie až do tvého objetí za…</p>
<div class="countdown" aria-label="Živý odpočet do příletu">
<div class="unit"><span class="number" id="days">--</span><span class="label">Dny</span></div>
<div class="unit"><span class="number" id="hours">--</span><span class="label">Hodiny</span></div>
<div class="unit"><span class="number" id="minutes">--</span><span class="label">Minuty</span></div>
<div class="unit"><span class="number" id="seconds">--</span><span class="label">Sekundy</span></div>
</div>
<div class="divider">♡</div>
<div class="flight">
<div>✈️ <strong>Let:</strong> QR291</div>
<div><strong>Destinace:</strong> Praha</div>
<div><strong>Přílet:</strong> 19. listopadu 2026 ve 12:55</div>
</div>
<p class="hug">Těším se domů ❤️</p>
</main>
<script>
const arrival = new Date('2026-11-19T12:55:00+01:00').getTime();
function updateCountdown(){
 let diff=Math.max(0,arrival-Date.now());
 const values=[
  Math.floor(diff/86400000),
  Math.floor((diff%86400000)/3600000),
  Math.floor((diff%3600000)/60000),
  Math.floor((diff%60000)/1000)
 ];
 ['days','hours','minutes','seconds'].forEach((id,i)=>document.getElementById(id).textContent=String(values[i]).padStart(2,'0'));
 if(arrival<=Date.now()) document.querySelector('.intro').textContent='Už jsem doma a těším se na tvoje objetí ❤️';
}
updateCountdown(); setInterval(updateCountdown,1000);
</script>
</body>
</html>
